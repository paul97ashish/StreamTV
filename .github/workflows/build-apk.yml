name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: StreamTV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mv app/build/outputs/apk/debug/app-debug.apk StreamTV-build-${{ github.run_number }}.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "StreamTV — Build ${{ github.run_number }}"
          body: |
            **Commit:** `${{ github.sha }}`
            **Message:** ${{ github.event.head_commit.message }}

            ### Install
            1. Download `StreamTV-build-${{ github.run_number }}.apk`
            2. Sideload onto your Android TV (`adb install StreamTV-build-${{ github.run_number }}.apk`)
          files: StreamTV-build-${{ github.run_number }}.apk
          draft: false
          prerelease: false
